[project]
name = "quantifiability"
version = "0.1.0"
description = "Predict whether dose-response profiling will return a reportable potency"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sean Lim"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rdkit>=2023.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
